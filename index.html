<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FURKAN KARAASLAN — DJ / Producer</title>
    <meta name="description" content="FURKAN KARAASLAN — DJ & Producer. Listen on SoundCloud, Spotify, Beatport.">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════════
           CSS CUSTOM PROPERTIES
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --bg: #0a0a0f;
            --fg: #f0ece4;
            --accent: #e8ff47;
            --accent-dim: #b8cc38;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --muted: rgba(240, 236, 228, 0.4);

            --font-display: 'Outfit', sans-serif;
            --font-mono: 'Space Mono', monospace;

            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-out-quint: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out-expo: cubic-bezier(1, 0, 0, 1);

            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 40px;
            --space-xl: 64px;
            --space-2xl: 96px;
        }

        /* ═══════════════════════════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════════════════════════ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: var(--font-display);
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            height: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.scrollable {
            overflow-y: auto;
        }

        html.scrollable {
            overflow-y: auto;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ═══════════════════════════════════════════════════════════════
           CUSTOM CURSOR (desktop only)
           ═══════════════════════════════════════════════════════════════ */
        @media (hover: hover) and (pointer: fine) {
            body { cursor: none; }
            a, button { cursor: none; }
        }

        .cursor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s var(--ease-out-expo),
                        width 0.3s var(--ease-out-expo),
                        height 0.3s var(--ease-out-expo),
                        border-color 0.3s ease,
                        background 0.3s ease;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }

        .cursor.hover {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-color: var(--accent);
        }

        @media (hover: hover) and (pointer: fine) {
            .cursor { display: block; }
        }

        /* ═══════════════════════════════════════════════════════════════
           CINEMATIC INTRO
           ═══════════════════════════════════════════════════════════════ */
        .intro {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            overflow: hidden;
        }

        .intro.phase-out {
            pointer-events: none;
        }

        /* ── Gate (tap to enter) ── */
        .intro-gate {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--bg);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.5s var(--ease-out-expo), visibility 0.5s;
            overflow: hidden;
        }

        .intro-gate.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gate-icon {
            position: relative;
            width: 70px;
            height: 70px;
            border: 2px solid rgba(232, 255, 71, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s var(--ease-out-expo),
                        border-color 0.3s ease,
                        background 0.3s ease;
        }

        .gate-ring {
            position: absolute;
            inset: -15px;
            border: 1px solid rgba(232, 255, 71, 0.2);
            border-radius: 50%;
            animation: gateRingPulse 2s ease-in-out infinite;
        }

        @keyframes gateRingPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.4); opacity: 0; }
        }

        .gate-icon svg {
            width: 24px;
            height: 24px;
            margin-left: 3px;
        }

        .intro-gate:hover .gate-icon,
        .intro-gate:active .gate-icon {
            transform: scale(1.1);
            border-color: var(--accent);
            background: rgba(232, 255, 71, 0.08);
        }

        .intro-gate:active .gate-icon {
            transform: scale(0.95);
        }

        .gate-text {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--fg);
            animation: gateBreathe 2.5s ease-in-out infinite;
        }

        @keyframes gateBreathe {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .gate-hint {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--accent);
            opacity: 0.6;
        }

        /* CRT scan lines */
        .intro-scanlines {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            opacity: 0.5;
        }

        /* Waveform */
        .intro-waveform {
            position: absolute;
            width: 60%;
            max-width: 400px;
            height: 60px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .intro-waveform.active {
            opacity: 1;
        }

        .intro-waveform.fade-out {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .intro-waveform svg {
            width: 100%;
            height: 100%;
        }

        .wave-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 1.2s var(--ease-out-expo);
        }

        .wave-line.drawn {
            stroke-dashoffset: 0;
        }

        /* Name reveal */
        .intro-name {
            position: absolute;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
        }

        .intro-name.active {
            opacity: 1;
        }

        .intro-name-line {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 9vw, 5.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            line-height: 1;
            display: flex;
            overflow: hidden;
        }

        .intro-char {
            display: inline-block;
            opacity: 0;
            transform: translateY(100%);
            filter: blur(8px);
            transition: all 0.5s var(--ease-out-expo);
        }

        .intro-char.revealed {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .intro-char.glitch {
            animation: charGlitch 0.15s steps(2) 3;
            color: var(--accent);
        }

        @keyframes charGlitch {
            0% { transform: translate(0, 0) skewX(0); }
            25% { transform: translate(-3px, 2px) skewX(5deg); }
            50% { transform: translate(3px, -1px) skewX(-3deg); }
            75% { transform: translate(-1px, -2px) skewX(2deg); }
            100% { transform: translate(0, 0) skewX(0); }
        }

        /* Expanding center line */
        .intro-line {
            position: absolute;
            z-index: 3;
            width: 0;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent), 0 0 60px rgba(232, 255, 71, 0.3);
            transition: width 0.8s var(--ease-out-expo);
            transform: translateY(40px);
        }

        .intro-line.expand {
            width: min(80%, 500px);
        }

        .intro-line.full {
            width: 110vw;
            transition: width 0.5s var(--ease-in-out-expo);
        }

        /* Subtitle */
        .intro-sub {
            position: absolute;
            z-index: 3;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo);
        }

        .intro-sub.active {
            opacity: 1;
            transform: translateY(55px);
        }

        /* Split curtains */
        .intro-curtain {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: var(--bg);
            z-index: 4;
            transition: transform 1s var(--ease-in-out-expo);
        }

        .intro-curtain--left {
            left: 0;
        }

        .intro-curtain--right {
            right: 0;
        }

        .intro-curtain--left.open {
            transform: translateX(-100%);
        }

        .intro-curtain--right.open {
            transform: translateX(100%);
        }

        /* Whole intro fade away */
        .intro.done {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease 0.2s, visibility 0s 0.6s;
        }

        /* Screen flash */
        .intro-flash {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: var(--accent);
            opacity: 0;
            pointer-events: none;
        }

        .intro-flash.fire {
            animation: screenFlash 0.5s ease-out forwards;
        }

        @keyframes screenFlash {
            0% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* ═══════════════════════════════════════════════════════════════
           VIDEO BACKGROUND
           ═══════════════════════════════════════════════════════════════ */
        .video-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            filter: saturate(0.6) contrast(1.1);
        }

        .video-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg,
                    rgba(10,10,15,0.5) 0%,
                    rgba(10,10,15,0.2) 30%,
                    rgba(10,10,15,0.3) 60%,
                    rgba(10,10,15,0.95) 100%
                );
            z-index: 1;
        }

        /* ── Ambient Edge Glow ── */
        .ambient-glow {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.5;
            transition: background-color 0.8s ease;
            mix-blend-mode: screen;
        }

        .ambient-glow--left {
            top: 10%;
            left: -40px;
            width: 120px;
            height: 80%;
            border-radius: 0 50% 50% 0;
        }

        .ambient-glow--right {
            top: 10%;
            right: -40px;
            width: 120px;
            height: 80%;
            border-radius: 50% 0 0 50%;
        }

        .ambient-glow--top {
            top: -40px;
            left: 10%;
            width: 80%;
            height: 100px;
            border-radius: 0 0 50% 50%;
        }

        .ambient-glow--bottom {
            bottom: -40px;
            left: 10%;
            width: 80%;
            height: 100px;
            border-radius: 50% 50% 0 0;
        }

        /* ═══════════════════════════════════════════════════════════════
           GRAIN OVERLAY
           ═══════════════════════════════════════════════════════════════ */
        .grain {
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            z-index: 9000;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            animation: grain 0.5s steps(1) infinite;
        }

        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* ═══════════════════════════════════════════════════════════════
           MAIN CONTENT
           ═══════════════════════════════════════════════════════════════ */
        .main {
            position: relative;
            z-index: 1;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-sm) var(--space-md);
            padding-top: max(var(--space-sm), env(safe-area-inset-top));
            padding-bottom: max(var(--space-sm), env(safe-area-inset-bottom));
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════════
           HERO NAME — GLITCH EFFECT
           ═══════════════════════════════════════════════════════════════ */
        .hero {
            text-align: center;
            margin-bottom: var(--space-xl);
            opacity: 0;
            transform: translateY(30px);
        }

        .hero.visible {
            animation: revealUp 1s var(--ease-out-expo) forwards;
        }

        .hero-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: var(--space-sm);
            display: block;
        }

        .hero-name {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .hero-name .line {
            display: block;
        }

        /* Glitch layers */
        .hero-name::before,
        .hero-name::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
        }

        .hero-name:hover::before {
            opacity: 0.8;
            color: #ff0050;
            animation: glitch1 0.3s ease forwards;
        }

        .hero-name:hover::after {
            opacity: 0.8;
            color: #00f2ff;
            animation: glitch2 0.3s ease forwards;
        }

        @keyframes glitch1 {
            0% { clip-path: inset(40% 0 61% 0); transform: translate(-4px, -2px); }
            20% { clip-path: inset(92% 0 1% 0); transform: translate(2px, 1px); }
            40% { clip-path: inset(43% 0 1% 0); transform: translate(-1px, 3px); }
            60% { clip-path: inset(25% 0 58% 0); transform: translate(3px, -1px); }
            80% { clip-path: inset(54% 0 7% 0); transform: translate(-2px, 2px); }
            100% { clip-path: inset(58% 0 43% 0); transform: translate(0); opacity: 0; }
        }

        @keyframes glitch2 {
            0% { clip-path: inset(65% 0 13% 0); transform: translate(4px, 2px); }
            20% { clip-path: inset(15% 0 65% 0); transform: translate(-3px, -1px); }
            40% { clip-path: inset(57% 0 2% 0); transform: translate(1px, -3px); }
            60% { clip-path: inset(34% 0 38% 0); transform: translate(-4px, 1px); }
            80% { clip-path: inset(12% 0 69% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(10% 0 75% 0); transform: translate(0); opacity: 0; }
        }

        .hero-sub {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: var(--space-md);
        }

        /* ═══════════════════════════════════════════════════════════════
           AUDIO VISUALIZER BAR (decorative)
           ═══════════════════════════════════════════════════════════════ */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 30px;
            margin-bottom: var(--space-lg);
            opacity: 0;
            transform: translateY(20px);
        }

        .visualizer.visible {
            animation: revealUp 0.8s var(--ease-out-expo) 0.3s forwards;
        }

        .visualizer .bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: visualize var(--dur) ease-in-out infinite alternate;
            opacity: 0.7;
        }

        @keyframes visualize {
            0% { height: 4px; }
            100% { height: var(--max-h); }
        }

        /* ═══════════════════════════════════════════════════════════════
           LINK CARDS
           ═══════════════════════════════════════════════════════════════ */
        .links {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            width: 100%;
            max-width: 420px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 18px 22px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s var(--ease-out-expo);
            overflow: hidden;
            opacity: 0;
        }

        /* Odd cards slide from left, even from right */
        .link-card:nth-child(odd) {
            transform: translateX(-80px) rotate(-2deg);
        }

        .link-card:nth-child(even) {
            transform: translateX(80px) rotate(2deg);
        }

        .link-card.visible:nth-child(odd) {
            animation: slideFromLeft 0.8s var(--ease-out-expo) forwards;
        }

        .link-card.visible:nth-child(even) {
            animation: slideFromRight 0.8s var(--ease-out-expo) forwards;
        }

        /* shimmer sweep on hover */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(232, 255, 71, 0.06),
                transparent
            );
            transition: left 0.6s var(--ease-out-expo);
        }

        .link-card:hover::before,
        .link-card:active::before {
            left: 100%;
        }

        .link-card:hover,
        .link-card:active {
            background: var(--glass-hover);
            border-color: rgba(232, 255, 71, 0.2);
            transform: translateY(-2px);
        }

        .link-card:active {
            transform: scale(0.97);
        }

        .link-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            transition: background 0.3s ease, transform 0.3s var(--ease-out-expo);
        }

        .link-card:hover .link-icon {
            background: rgba(232, 255, 71, 0.12);
            transform: scale(1.05);
        }

        .link-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--fg);
            transition: fill 0.3s ease;
        }

        .link-card:hover .link-icon svg {
            fill: var(--accent);
        }

        .link-info {
            flex: 1;
            min-width: 0;
        }

        .link-title {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.02em;
        }

        .link-desc {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 2px;
        }

        .link-arrow {
            width: 20px;
            height: 20px;
            opacity: 0.3;
            transition: opacity 0.3s ease, transform 0.3s var(--ease-out-expo);
            flex-shrink: 0;
        }

        .link-card:hover .link-arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        .link-arrow svg {
            width: 20px;
            height: 20px;
            stroke: var(--fg);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ═══════════════════════════════════════════════════════════════
           FOOTER AREA
           ═══════════════════════════════════════════════════════════════ */
        .footer {
            margin-top: var(--space-xl);
            text-align: center;
            opacity: 0;
            transform: translateY(15px);
        }

        .footer.visible {
            animation: revealUp 0.8s var(--ease-out-expo) forwards;
        }

        .footer-line {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin: 0 auto var(--space-sm);
        }

        .footer-text {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .footer-text .year {
            color: var(--accent);
        }

        /* ═══════════════════════════════════════════════════════════════
           ANIMATIONS
           ═══════════════════════════════════════════════════════════════ */
        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideFromLeft {
            from {
                opacity: 0;
                transform: translateX(-80px) rotate(-2deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotate(0deg);
            }
        }

        @keyframes slideFromRight {
            from {
                opacity: 0;
                transform: translateX(80px) rotate(2deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotate(0deg);
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           FLOATING PARTICLES
           ═══════════════════════════════════════════════════════════════ */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
                transform: translateY(90vh) scale(1);
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(0.5);
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════════════════ */
        @media (min-width: 768px) {
            .main {
                padding: var(--space-2xl) var(--space-lg);
            }

            .link-card {
                padding: 22px 28px;
                border-radius: 20px;
            }

            .hero-sub {
                font-size: 13px;
                letter-spacing: 5px;
            }
        }

        @media (min-width: 1024px) {
            .links {
                max-width: 480px;
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           REDUCED MOTION
           ═══════════════════════════════════════════════════════════════ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .grain { animation: none; }
            .particle { animation: none; }
            .visualizer .bar { animation: none; height: 15px; }

            .hero, .link-card, .visualizer, .footer {
                opacity: 1;
                transform: none;
            }

            .intro { display: none; }
        }
    </style>

    <!-- ═══════════════════════════════════════════════════════════════
         JAVASCRIPT
         ═══════════════════════════════════════════════════════════════ -->
    <script>
        // ── Custom Cursor ──
        (() => {
            const cursor = document.getElementById('cursor');
            if (!cursor) return;

            let mx = 0, my = 0, cx = 0, cy = 0;

            document.addEventListener('mousemove', e => {
                mx = e.clientX;
                my = e.clientY;
            });

            function lerp(a, b, t) { return a + (b - a) * t; }

            function animate() {
                cx = lerp(cx, mx, 0.15);
                cy = lerp(cy, my, 0.15);
                cursor.style.left = cx + 'px';
                cursor.style.top = cy + 'px';
                requestAnimationFrame(animate);
            }
            animate();

            document.querySelectorAll('a, button').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
            });
        })();

        // ── Audio Visualizer Bars ──
        (() => {
            const container = document.getElementById('visualizer');
            const barCount = 24;

            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                const maxH = Math.random() * 22 + 6;
                const dur = (Math.random() * 0.6 + 0.4).toFixed(2);
                bar.style.setProperty('--max-h', maxH + 'px');
                bar.style.setProperty('--dur', dur + 's');
                bar.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
                container.appendChild(bar);
            }
        })();

        // ── Floating Particles ──
        (() => {
            const container = document.getElementById('particles');
            const count = 20;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = (Math.random() * 2 + 1) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        })();

        // ── Ambient Edge Lighting (Ambilight) ──
        (() => {
            const video = document.getElementById('bgVideo');
            const canvas = document.getElementById('ambientCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const glowL = document.getElementById('glowLeft');
            const glowR = document.getElementById('glowRight');
            const glowT = document.getElementById('glowTop');
            const glowB = document.getElementById('glowBottom');

            function sampleEdge(x, y, w, h) {
                const data = ctx.getImageData(x, y, w, h).data;
                let r = 0, g = 0, b = 0, count = 0;
                for (let i = 0; i < data.length; i += 4) {
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                    count++;
                }
                r = Math.round(r / count);
                g = Math.round(g / count);
                b = Math.round(b / count);
                // Boost saturation a bit
                const max = Math.max(r, g, b);
                const boost = max > 0 ? 255 / max * 0.8 : 1;
                return `rgb(${Math.min(255, Math.round(r * boost))}, ${Math.min(255, Math.round(g * boost))}, ${Math.min(255, Math.round(b * boost))})`;
            }

            function updateGlow() {
                if (video.readyState < 2) {
                    requestAnimationFrame(updateGlow);
                    return;
                }
                ctx.drawImage(video, 0, 0, 16, 9);

                glowL.style.backgroundColor = sampleEdge(0, 0, 2, 9);
                glowR.style.backgroundColor = sampleEdge(14, 0, 2, 9);
                glowT.style.backgroundColor = sampleEdge(0, 0, 16, 2);
                glowB.style.backgroundColor = sampleEdge(0, 7, 16, 2);

                setTimeout(() => requestAnimationFrame(updateGlow), 200);
            }

            video.addEventListener('playing', () => requestAnimationFrame(updateGlow));
            if (!video.paused) requestAnimationFrame(updateGlow);
        })();

        // ═══════════════════════════════════════════════════════════════
        //  CINEMATIC INTRO SEQUENCE
        // ═══════════════════════════════════════════════════════════════
        (() => {
            const intro       = document.getElementById('intro');
            const gate        = document.getElementById('introGate');
            const waveform    = document.getElementById('introWaveform');
            const waveLine    = document.querySelector('.wave-line');
            const introName   = document.getElementById('introName');
            const firstName   = document.getElementById('introFirstName');
            const lastName    = document.getElementById('introLastName');
            const introLine   = document.getElementById('introLine');
            const introSub    = document.getElementById('introSub');
            const curtainL    = document.getElementById('curtainLeft');
            const curtainR    = document.getElementById('curtainRight');
            const video       = document.getElementById('bgVideo');

            // Build waveform SVG points
            function generateWavePoints() {
                let points = '';
                for (let x = 0; x <= 200; x += 2) {
                    const y = 30 + Math.sin(x * 0.15) * 12 * Math.random()
                            + Math.cos(x * 0.08) * 8 * Math.random()
                            + (Math.random() - 0.5) * 10;
                    points += `${x},${y.toFixed(1)} `;
                }
                return points.trim();
            }

            // Insert characters as individual spans
            function populateChars(container, text) {
                text.split('').forEach(char => {
                    const span = document.createElement('span');
                    span.className = 'intro-char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    container.appendChild(span);
                });
            }

            populateChars(firstName, 'FURKAN');
            populateChars(lastName, 'KARAASLAN');

            const allChars = document.querySelectorAll('.intro-char');

            // ── GATE: Wait for user tap to enable audio ──
            gate.addEventListener('click', function startExperience() {
                gate.removeEventListener('click', startExperience);

                // Unmute video and play with sound
                video.muted = false;
                video.volume = 1.0;
                video.currentTime = 0;
                video.play().catch(() => {
                    // fallback: keep playing muted if browser still blocks
                    video.muted = true;
                    video.play();
                });

                // Fade out gate
                gate.classList.add('hidden');

                // ── START TIMELINE ──

                // Phase 1: Waveform
                setTimeout(() => {
                    waveLine.setAttribute('points', generateWavePoints());
                    waveform.classList.add('active');
                    setTimeout(() => waveLine.classList.add('drawn'), 30);
                }, 100);

                // Phase 2: Name reveal
                setTimeout(() => {
                    waveform.classList.add('fade-out');

                    setTimeout(() => {
                        introName.classList.add('active');

                        allChars.forEach((ch, i) => {
                            setTimeout(() => {
                                ch.classList.add('glitch');
                            }, i * 40);

                            setTimeout(() => {
                                ch.classList.remove('glitch');
                                ch.classList.add('revealed');
                            }, i * 40 + 80);
                        });
                    }, 200);
                }, 700);

                // Phase 3: Line expand + subtitle
                setTimeout(() => {
                    introLine.classList.add('expand');
                    setTimeout(() => introSub.classList.add('active'), 150);
                }, 1600);

                // Phase 4: Flash + curtain split
                setTimeout(() => {
                    const flash = document.createElement('div');
                    flash.className = 'intro-flash';
                    intro.appendChild(flash);

                    requestAnimationFrame(() => flash.classList.add('fire'));
                    introLine.classList.add('full');

                    setTimeout(() => {
                        curtainL.classList.add('open');
                        curtainR.classList.add('open');
                        intro.classList.add('phase-out');

                        revealContent();

                        setTimeout(() => {
                            intro.classList.add('done');
                            setTimeout(() => intro.remove(), 400);
                        }, 600);
                    }, 150);
                }, 2200);
            });
        })();

        // ── Staggered Content Reveal ──
        function revealContent() {
            const hero = document.getElementById('hero');
            const visualizer = document.getElementById('visualizer');
            const cards = document.querySelectorAll('.link-card');
            const footer = document.getElementById('footer');

            setTimeout(() => hero.classList.add('visible'), 200);
            setTimeout(() => visualizer.classList.add('visible'), 600);

            cards.forEach((card, i) => {
                setTimeout(() => card.classList.add('visible'), 800 + i * 150);
            });

            const totalTime = 800 + cards.length * 150 + 300;
            setTimeout(() => footer.classList.add('visible'), totalTime);

            // Unlock scrolling after everything is revealed
            setTimeout(() => {
                document.documentElement.classList.add('scrollable');
                document.body.classList.add('scrollable');
            }, totalTime + 500);
        }

        // ── Magnetic Hover Effect on cards (desktop) ──
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            document.querySelectorAll('.link-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const deltaX = (x - centerX) / centerX * 3;
                    const deltaY = (y - centerY) / centerY * 2;

                    card.style.transform = `translateY(-2px) perspective(600px) rotateX(${-deltaY}deg) rotateY(${deltaX}deg)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                });
            });
        }
    </script>
